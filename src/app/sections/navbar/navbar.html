<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-colors duration-300"
  [class]="solid() ? 'border-line bg-surface/80 backdrop-blur-lg' : 'border-transparent'"
>
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
    <a href="#home" class="flex items-center gap-2.5 font-display font-bold" (click)="closeMenu()">
      <span
        class="grid size-9 place-items-center rounded-xl bg-fg text-sm tracking-tight text-surface transition-colors"
      >
        JB
      </span>
      <span class="tracking-tight">Jihed Berlim</span>
    </a>

    <nav [attr.aria-label]="t().a11y.mainNav" class="hidden md:block">
      <ul class="flex items-center gap-1 rounded-full border border-line bg-card/60 p-1 backdrop-blur">
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              class="block rounded-full px-4 py-1.5 text-sm font-medium transition-colors"
              [class]="activeSection() === link.id ? 'bg-accent-soft text-accent' : 'text-muted hover:text-fg'"
              [attr.aria-current]="activeSection() === link.id ? 'true' : null"
            >
              {{ t().nav[link.label] }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="toggleLang()"
        [attr.aria-label]="t().a11y.switchLanguage"
        [attr.title]="t().a11y.switchLanguage"
        class="flex h-9 items-center gap-1 rounded-full border border-line bg-card/60 px-3 font-mono text-xs transition-colors hover:border-accent"
      >
        <span [class]="lang() === 'pt' ? 'text-accent' : 'text-muted'">PT</span>
        <span class="text-line" aria-hidden="true">/</span>
        <span [class]="lang() === 'en' ? 'text-accent' : 'text-muted'">EN</span>
      </button>

      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="t().a11y.toggleTheme"
        [attr.title]="t().a11y.toggleTheme"
        class="grid size-9 place-items-center rounded-full border border-line bg-card/60 text-muted transition-colors hover:border-accent hover:text-accent"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" class="size-4" />
      </button>

      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-label]="menuOpen() ? t().a11y.closeMenu : t().a11y.openMenu"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        class="grid size-9 place-items-center rounded-full border border-line bg-card/60 md:hidden"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" class="size-4" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-menu" [attr.aria-label]="t().a11y.mainNav" class="border-t border-line md:hidden">
      <ul class="mx-auto max-w-6xl space-y-1 px-4 py-4">
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              (click)="closeMenu()"
              class="block rounded-xl px-4 py-3 font-medium transition-colors"
              [class]="activeSection() === link.id ? 'bg-accent-soft text-accent' : 'text-muted hover:bg-card hover:text-fg'"
              [attr.aria-current]="activeSection() === link.id ? 'true' : null"
            >
              {{ t().nav[link.label] }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
