<footer id="contact" class="scroll-mt-16 border-t border-line bg-surface-2">
  <div class="mx-auto max-w-6xl px-4 py-24 sm:px-6 sm:py-32">
    <div
      appReveal
      class="relative isolate overflow-hidden rounded-[2rem] border border-line bg-card px-6 py-14 sm:px-14 sm:py-20"
    >
      <div
        aria-hidden="true"
        class="pointer-events-none absolute -right-24 -bottom-32 -z-10 size-96 rounded-full bg-accent/20 blur-3xl"
      ></div>

      <p class="font-mono text-xs tracking-widest text-accent uppercase">{{ t().contact.eyebrow }}</p>
      <h2 class="mt-4 font-display text-4xl font-bold tracking-tight sm:text-6xl">{{ t().contact.title }}</h2>
      <p class="mt-5 max-w-xl text-base leading-relaxed text-muted sm:text-lg">{{ t().contact.description }}</p>

      <div class="mt-10 flex flex-wrap items-center gap-3">
        <a
          [href]="'mailto:' + email"
          class="font-display text-xl font-semibold break-all underline decoration-accent/40 decoration-2 underline-offset-8 transition-colors hover:text-accent sm:text-3xl"
        >
          {{ email }}
        </a>
        <button
          type="button"
          (click)="copyEmail()"
          [attr.aria-label]="t().contact.copy"
          [attr.title]="t().contact.copy"
          class="grid size-10 place-items-center rounded-full border border-line text-muted transition-colors hover:border-accent hover:text-accent"
        >
          <app-icon [name]="copied() ? 'check' : 'copy'" class="size-4" />
        </button>
        <span class="text-sm text-accent" aria-live="polite">{{ copied() ? t().contact.copied : '' }}</span>
      </div>

      <div class="mt-10 flex flex-wrap gap-3">
        <a
          [href]="'mailto:' + email"
          class="inline-flex items-center gap-2 rounded-full bg-fg px-6 py-3 text-sm font-semibold text-surface transition-colors hover:bg-accent hover:text-on-accent"
        >
          <app-icon name="mail" class="size-4" />
          E-mail
        </a>
        <a
          [href]="whatsapp()"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 rounded-full border border-line px-6 py-3 text-sm font-semibold transition-colors hover:border-accent hover:text-accent"
        >
          <app-icon name="whatsapp" class="size-4" />
          WhatsApp
        </a>
      </div>
    </div>

    <div class="mt-12 flex flex-col-reverse items-start justify-between gap-6 sm:flex-row sm:items-center">
      <div class="text-sm text-muted">
        <p>&copy; {{ year }} Jihed Berlim. {{ t().contact.rights }}</p>
        <p class="mt-1">{{ t().contact.builtWith }}</p>
      </div>
      <div class="flex items-center gap-3">
        <app-social-links />
        <a
          href="#home"
          [attr.aria-label]="t().contact.backToTop"
          [attr.title]="t().contact.backToTop"
          class="grid size-11 place-items-center rounded-full bg-fg text-surface transition-colors hover:bg-accent hover:text-on-accent"
        >
          <app-icon name="arrow-up" class="size-4" />
        </a>
      </div>
    </div>
  </div>
</footer>
